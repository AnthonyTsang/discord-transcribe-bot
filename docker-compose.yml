services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HEALTH_PORT:-3000}:${HEALTH_PORT:-3000}"
    volumes:
      # Named volumes — Docker manages permissions so the bun user can always write
      - transcripts:/app/transcripts
      - data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${HEALTH_PORT:-3000} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      whisper:
        condition: service_healthy
        required: false   # bot starts normally when TRANSCRIBER != whisper

  whisper:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda
    restart: unless-stopped
    environment:
      - PRELOAD_MODELS=["Systran/faster-whisper-large-v3"]
    volumes:
      - whisper-models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s   # large-v3 takes ~30-60s to load on first start

volumes:
  transcripts:
  data:
  whisper-models:   # persists the downloaded large-v3 model between restarts
